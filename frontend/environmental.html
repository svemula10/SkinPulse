<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkinPulse — Environmental Advisor</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>

  <header>
    <div class="logo-dot">
      <svg viewBox="0 0 24 24"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16h2v-2.95h-2V21.5zm-7.45-3.91l1.41 1.41 1.79-1.79-1.41-1.41-1.79 1.79z"/></svg>
    </div>
    <h1>SkinPulse</h1>
    <span>Climate & UV Advisor</span>
    
    <nav style="margin-left: auto; display: flex; gap: 15px; align-items: center;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--text); text-decoration: none; font-weight: 500;">Home</a>
      <a href="dashboard.html" style="font-size: 0.85rem; color: var(--text); text-decoration: none; font-weight: 500;">Scan History</a>
      <a href="environmental.html" style="font-size: 0.85rem; color: var(--sage); text-decoration: none; font-weight: 500;">Environmental Advisor</a>
      <a href="safety.html" style="font-size: 0.85rem; color: var(--text); text-decoration: none; font-weight: 500;">Ingredient Safety</a>
    </nav>
  </header>

  <main style="max-width: 750px; margin: 2rem auto; padding: 0 1.5rem;">
    <div class="results-header" style="margin-bottom: 1.5rem;">
      <h2>Climate & UV <span>Skin Advisor</span></h2>
    </div>
    <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
      Select a saved skin profile, then click anywhere on the interactive map or use your GPS to analyze live microclimate skin risks.
    </p>

    <div style="margin-bottom: 1.25rem;">
      <label for="envScanSelect" style="display: block; font-size: 0.8rem; font-weight: 500; color: var(--text); margin-bottom: 0.35rem;">Select Saved Profile</label>
      <select id="envScanSelect" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; background: var(--card); color: var(--text);">
        <option value="">-- Load a past scan profile --</option>
      </select>
    </div>

    <div style="margin-bottom: 1.25rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
        <label style="font-size: 0.8rem; font-weight: 500; color: var(--text);">Click Location on Map or Use GPS</label>
        <button type="button" id="useGpsBtn" style="background: none; border: none; color: var(--sage); font-size: 0.75rem; font-weight: 600; cursor: pointer; padding: 0;">📍 Use My Current Location</button>
      </div>
      <div id="climateMap" style="width: 100%; height: 320px; border-radius: var(--radius); border: 1px solid var(--border); z-index: 1;"></div>
      <div id="selectedLocationLabel" style="font-size: 0.75rem; color: var(--muted); margin-top: 6px;">Active Region: None selected</div>
    </div>

    <button type="button" id="fetchEnvBtn" class="new-scan-btn" style="background: var(--sage); color: white; width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-bottom: 1.5rem; cursor: pointer; border: none; border-radius: var(--radius);">
      Run Climate & Skin Vulnerability Assessment
    </button>

    <div id="envResultsContent" style="display: none;"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/environmental.js"></script>
</body>
</html>
