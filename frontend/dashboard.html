<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkinPulse — Scan History</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header>
  <div class="logo-dot">
    <svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 5.5 5 9c0 5 7 13 7 13s7-8 7-13c0-3.5-3-7-7-7zm0 9a2 2 0 110-4 2 2 0 010 4z"/></svg>
  </div>
  <h1>SkinPulse History</h1>
  <span>Past Scans</span>
  <nav style="margin-left: auto; display: flex; gap: 15px; align-items: center;">
    <a href="index.html" style="font-size: 0.85rem; color: var(--text); text-decoration: none; font-weight: 500;">Home</a>
    <a href="dashboard.html" style="font-size: 0.85rem; color: var(--sage); text-decoration: none; font-weight: 500;">Scan History</a>
    <a href="environmental.html" style="font-size: 0.85rem; color: var(--text); text-decoration: none; font-weight: 500;">Environmental Advisor</a>
    <a href="safety.html" style="font-size: 0.85rem; color: var(--text); text-decoration: none; font-weight: 500;">Ingredient Safety</a>
  </nav>
</header>

<main style="max-width: 800px;">
  <div class="hero" style="margin-bottom: 2rem;">
    <h2>Your scan archive, <em>all in one place</em></h2>
    <p>Switch between different past reports (yours, family members, etc.) just like chat threads.</p>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <div class="section-title" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
      <div class="dot"></div>Saved Scan Sessions
    </div>
    <button id="deleteAllBtn" class="new-scan-btn" style="width: auto; padding: 0.4rem 0.8rem; border-color: #c46b6b; color: #c46b6b; font-size: 0.75rem;">
      🗑 Clear All History
    </button>
  </div>

  <div id="scansList" style="display: flex; flex-direction: column; gap: 12px;">
    <p style="color: var(--muted); text-align: center; padding: 2rem;">Loading scan archive...</p>
  </div>

  <div id="reportContainer" style="display: none; margin-top: 2rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <button onclick="closeReport()" class="reset-btn">← Back to list</button>
      
      <button onclick="downloadArchivedPDFReport()" class="new-scan-btn" style="background: var(--sage); color: white; width: auto; padding: 0.4rem 1rem; font-size: 0.8rem; margin: 0;">
        ↓ Download PDF Report
      </button>
    </div>

    <div id="reportContent" style="background: var(--card); padding: 10px;"></div>
  </div>
</main>

<script src="js/dashboard.js"></script>
</body>
</html>
